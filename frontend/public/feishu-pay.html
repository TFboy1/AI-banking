<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>有数 · 交易确认</title><link rel="stylesheet" href="/feishu-pay.css"><link rel="stylesheet" href="/face-camera.css?v=20261019-guide3"><script src="/feishu-pay.js" defer></script></head>
<body><main><header><span class="logo">有数</span><span>飞书交易确认</span></header>
<section id="loading" aria-live="polite">正在核对交易状态…</section>
<section id="login" hidden><h1>登录有数</h1><p>首次打开，请认证这笔交易所属的账号。</p><form id="login-form"><label>手机号<input id="phone" inputmode="tel" autocomplete="tel" maxlength="11" pattern="1[0-9]{10}" required></label><label>短信验证码<span class="code-row"><input id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required><button type="button" id="login-sms" class="secondary">获取验证码</button></span></label><button type="submit" class="primary">认证并查看交易</button></form></section>
<section id="payment" hidden><p class="eyebrow">请核对本次操作</p><h1 id="title"></h1><div id="amount" class="amount"></div><dl id="fields"></dl><form id="pay-form"><label id="account-label" hidden>付款账户<select id="account"><option value="">请选择付款账户</option></select></label><p id="risk" class="hint"></p><label id="sms-label" hidden>交易短信验证码<span class="code-row"><input id="sms-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><button type="button" id="pay-sms" class="secondary">获取验证码</button></span></label><label>四位交易密码<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" required></label><button id="face-verify" class="secondary" type="button">刷脸验证</button><button id="password-fallback" class="quiet" type="button">改用支付密码</button><p id="face-status" class="hint"></p><button id="confirm" class="primary" type="submit">验证并确认交易</button><button id="cancel" class="quiet" type="button">取消这笔交易</button></form></section>
<section id="result" hidden aria-live="polite"><div id="status-icon" class="status-icon">✓</div><h1 id="status-title"></h1><p id="status-detail"></p><p id="receipt" class="receipt"></p><button id="close" class="primary" type="button">关闭页面，返回飞书</button><p class="hint">如未自动关闭，请使用飞书左上角关闭按钮。</p></section>
<p id="error" class="error" role="alert" hidden></p><button id="refresh" class="secondary" type="button" hidden>重新核对交易状态</button><button id="switch" class="quiet" type="button" hidden>使用其他手机号登录</button>
<footer>演示系统 · 仅操作虚拟资金<br>关闭网页不会撤销已经完成的交易。</footer></main><aside id="demo-sms" role="status" hidden><strong>模拟短信</strong><p id="demo-code"></p><button type="button" id="hide-sms" aria-label="关闭短信提示">×</button></aside></body></html>
