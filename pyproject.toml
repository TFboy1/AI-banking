[project]
name = "ai-banking"
version = "0.1.0"
description = "A minimal conversational banking sandbox"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
feishu = ["lark-oapi>=1.4,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/banking"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110
